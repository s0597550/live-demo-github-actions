# ─────────────────────────────────────────────────────────────
# Demo: Secrets, Variablen und manuelle Eingaben
# Start: Actions → "Secrets-Demo" → "Run workflow"
# Vorher anlegen: Settings → Secrets and variables → Actions
#   Secret:   DEMO_API_KEY   (beliebiger Wert)
#   Variable: DEPLOY_TARGET  (z. B. "staging")
# ─────────────────────────────────────────────────────────────
name: Secrets-Demo

on:
  workflow_dispatch:
    inputs:
      name:
        description: Wer wird begrüßt?
        default: KBE-Kurs
        required: true

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.DEMO_API_KEY }}
    steps:
      - name: Eingabe aus workflow_dispatch
        run: echo "Hallo ${{ inputs.name }} 👋"

      - name: Variable (nicht geheim, im Log sichtbar)
        run: echo "Deploy-Ziel ist ${{ vars.DEPLOY_TARGET }}"

      - name: Secret (wird im Log maskiert)
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::warning::Secret DEMO_API_KEY ist nicht gesetzt"
            exit 0
          fi
          echo "Versuch, das Secret auszugeben: $API_KEY"
          echo "Länge des Secrets: ${#API_KEY} Zeichen"

      - name: Zusammenfassung in der Run-Übersicht
        run: |
          {
            echo "### Secrets-Demo ✅"
            echo "| Quelle | Wert |"
            echo "|---|---|"
            echo "| inputs.name | ${{ inputs.name }} |"
            echo "| vars.DEPLOY_TARGET | ${{ vars.DEPLOY_TARGET }} |"
            echo "| secrets.DEMO_API_KEY | *** (maskiert) |"
          } >> "$GITHUB_STEP_SUMMARY"
