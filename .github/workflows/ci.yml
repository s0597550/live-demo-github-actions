# ─────────────────────────────────────────────────────────────
# CI-Pipeline für Vue 3 (Frontend) und Quarkus (Backend)
# Läuft bei jedem Push auf main, bei jedem Pull Request
# und kann manuell gestartet werden.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Neuer Push auf denselben Branch bricht den alten Lauf ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least Privilege: standardmäßig nur Lesezugriff
permissions:
  contents: read

jobs:
  # ── Job 1: Frontend (läuft parallel zu Job 2) ──────────────
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten (mit npm-Cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Linting (ESLint)
        run: npm run lint

      - name: Unit-Tests (Vitest)
        run: npm test

      - name: Production-Build (vue-tsc + Vite)
        run: npm run build

      - name: Build-Artefakt hochladen
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── Job 2: Backend (läuft parallel zu Job 1) ───────────────
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: JDK einrichten (mit Maven-Cache)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build + Tests (Maven)
        run: mvn -B --no-transfer-progress verify

      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          retention-days: 7

  # ── Job 3: Website auf GitHub Pages (nur wenn Frontend grün, nur auf main)
  pages:
    name: Website → GitHub Pages
    needs: frontend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages # nie zwei Deploys gleichzeitig (siehe auch publikum.yml)
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # Artefakt der Website finden
      pages: write    # Website veröffentlichen
      id-token: write # Nachweis gegenüber GitHub Pages, dass dieser Lauf echt ist
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten (mit npm-Cache)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Website bauen (mit Build-Infos)
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_BUILD_RUN: ${{ github.run_number }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          VITE_REPO: ${{ github.repository }}

      - name: version.json für das Auto-Update schreiben
        run: echo '{"sha":"${{ github.sha }}"}' > dist/version.json

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6

      # Eindeutiger Name pro Versuch – sonst findet GitHub bei "Re-run" zwei Artefakte
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
          name: website-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub hakt manchmal kurz ("No artifacts named github-pages were found").
      # Dann nicht rot werden, sondern nach kurzer Pause erneut versuchen.
      - name: Website veröffentlichen
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Kurz warten (GitHub-Aussetzer)
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Website veröffentlichen (2. Versuch)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Nochmal warten
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 30

      - name: Website veröffentlichen (3. Versuch)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}

  # ── Job 4: Docker-Images (nur wenn 1 + 2 grün, nur auf main) ─
  docker:
    name: Docker-Images → GHCR
    needs: [frontend, backend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nötig, um nach ghcr.io zu pushen
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # automatisch bereitgestellt

      - name: Image-Tags erzeugen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Image bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
