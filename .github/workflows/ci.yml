# ─────────────────────────────────────────────────────────────
# CI-Pipeline für Vue 3 (Frontend) und Quarkus (Backend)
# Läuft bei jedem Push auf main, bei jedem Pull Request
# und kann manuell gestartet werden.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Neuer Push auf denselben Branch bricht den alten Lauf ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least Privilege: standardmäßig nur Lesezugriff
permissions:
  contents: read

jobs:
  # ── Job 1: Frontend (läuft parallel zu Job 2) ──────────────
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten (mit npm-Cache)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Linting (ESLint)
        run: npm run lint

      - name: Unit-Tests (Vitest)
        run: npm test

      - name: Production-Build (vue-tsc + Vite)
        run: npm run build

      - name: Build-Artefakt hochladen
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── Job 2: Backend (läuft parallel zu Job 1) ───────────────
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: JDK einrichten (mit Maven-Cache)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build + Tests (Maven)
        run: mvn -B --no-transfer-progress verify

      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          retention-days: 7

  # ── Job 3: Docker-Images (nur wenn 1 + 2 grün, nur auf main) ─
  docker:
    name: Docker-Images → GHCR
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nötig, um nach ghcr.io zu pushen
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # automatisch bereitgestellt

      - name: Image-Tags erzeugen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Image bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
