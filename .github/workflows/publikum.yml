# ─────────────────────────────────────────────────────────────
# LIVE-DEMO: Das Publikum steuert die Pipeline.
# Jemand scannt den QR-Code und schickt seinen Namen (über den Google-Helfer)
# ODER öffnet ein Issue („Hallo von Lisa“) → ein Bot antwortet →
# der Gruß wird ins Repo geschrieben → Tests → neue Website ist live.
# Plan B: Actions → "Publikum" → "Run workflow" (ohne Issue).
# ─────────────────────────────────────────────────────────────
name: Publikum

on:
  issues:
    types: [opened]
  repository_dispatch: # vom Google-Helfer (QR-Code → Website → Name senden)
    types: [gruss]
  workflow_dispatch:
    inputs:
      gruss:
        description: Gruß (Plan B, falls niemand ein Issue öffnet)
        default: Hallo vom KBE-Kurs
        required: true

permissions:
  contents: read

jobs:
  # ── Job 1: Bot antwortet und schreibt den Gruß ins Repo ─────
  gruss:
    name: Bot – Gruß eintragen
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gruß committen
      issues: write # im Issue antworten
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Bot antwortet im Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "👋 Danke @$AUTHOR! Ich bin ein Bot (GitHub Actions). Die Pipeline testet und veröffentlicht die Website gerade neu – in ca. einer Minute steht dein Gruß hier: $SITE"

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Sicherheit: Der Issue-Titel kommt von fremden Personen. Er wird nur als
      # Umgebungsvariable übergeben, nie direkt in den Befehl eingesetzt.
      - name: Gruß eintragen und committen
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.client_payload.name || inputs.gruss }}
          ISSUE_USER: ${{ github.event.issue.user.login || (github.event_name == 'repository_dispatch' && 'gast') || github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Mehrere Issues gleichzeitig? Dann neu holen und nochmal versuchen.
          for attempt in $(seq 1 20); do
            git fetch -q origin main
            git reset -q --hard origin/main
            node .github/scripts/add-greeting.mts
            git add frontend/src/guestbook.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "Gruß von @$ISSUE_USER (Issue #$ISSUE_NUMBER)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "Push-Konflikt (Versuch $attempt) – nochmal"
            sleep $((RANDOM % 6 + 1))
          done
          exit 1

  # ── Job 2: Testen und Website veröffentlichen ───────────────
  website:
    name: Testen + Website veröffentlichen
    needs: gruss
    runs-on: ubuntu-latest
    # Viele Grüße auf einmal: Deploys laufen nacheinander, der neueste gewinnt.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # Artefakt der Website finden
      pages: write
      id-token: write
      issues: write # "Live!"-Antwort im Issue
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Neuesten Stand von main auschecken
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Node.js einrichten (mit npm-Cache)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Unit-Tests (Vitest)
        run: npm test

      - name: Build-Infos setzen
        env:
          NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login || github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "VITE_BUILD_SHA=$(git rev-parse HEAD)"
            echo "VITE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ "$EVENT" = "repository_dispatch" ]; then
              echo "VITE_BUILD_LABEL=Gruß per QR-Code"
            elif [ -n "$NUMBER" ]; then
              echo "VITE_BUILD_LABEL=Issue #$NUMBER von @$AUTHOR"
            else
              echo "VITE_BUILD_LABEL=Gruß von @$AUTHOR"
            fi
          } >> "$GITHUB_ENV"

      - name: Website bauen
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_BUILD_RUN: ${{ github.run_number }}
          VITE_REPO: ${{ github.repository }}

      - name: version.json für das Auto-Update schreiben
        run: echo "{\"sha\":\"$VITE_BUILD_SHA\"}" > dist/version.json

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6

      # Eindeutiger Name pro Versuch – sonst findet GitHub bei "Re-run" zwei Artefakte
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
          name: website-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub hakt manchmal kurz ("No artifacts named github-pages were found").
      # Dann nicht rot werden, sondern nach kurzer Pause erneut versuchen.
      - name: Website veröffentlichen
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Kurz warten (GitHub-Aussetzer)
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Website veröffentlichen (2. Versuch)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Nochmal warten
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 30

      - name: Website veröffentlichen (3. Versuch)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bot meldet "live" und schließt das Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          SITE: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
        run: |
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "✅ Live! Dein Gruß ist jetzt auf der Website: $SITE – getestet, gebaut und veröffentlicht von GitHub Actions."
